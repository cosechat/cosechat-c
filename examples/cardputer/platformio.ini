; cosechat demo for CardputerADV.
;
;   ./fetch-wolfssl.sh                                  # once: wolfSSL >= 5.8
;   pio run -e lora --target upload --target monitor    # M5 LoRa Cap 1262
;   pio run -e wifi --target upload --target monitor    # WiFi + UDP
;   pio run -e ble --target upload --target monitor     # anonymous BLE adverts
;   pio run -e dot11 --target upload --target monitor   # raw 802.11 mgmt frames
;
; The wifi env needs credentials: set WIFI_SSID/WIFI_PASS below.
;
; lib/wolfssl is a local PlatformIO library built from a wolfSSL >= 5.8 tree
; (the registry package stops at 5.7.2 and has no ML-KEM). See README.md.

[env]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
; wolfCOSE ships no PlatformIO manifest, so its include/ directory never reaches
; the cosechat library's own sources. PlatformIO expands ${PROJECT_LIBDEPS_DIR}
; and ${PIOENV} in this flag.
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DWOLFSSL_USER_SETTINGS
    -DCC_POW_DIFFICULTY=1
    -I${PROJECT_LIBDEPS_DIR}/${PIOENV}/wolfCOSE/include
lib_deps =
    m5stack/M5Cardputer
    symlink://lib/wolfssl
    https://github.com/konsumer/wolfCOSE.git#124ee3c
    symlink://../..

[env:lora]
lib_deps =
    ${env.lib_deps}
    jgromes/RadioLib

[env:wifi]
build_flags =
    ${env.build_flags}
    -DCC_ROAD_WIFI
    -DWIFI_SSID=\"your-ssid\"
    -DWIFI_PASS=\"your-pass\"

; Anonymous BLE extended advertising. Extended advertising must be enabled in
; NimBLE, and the ESP32-S3 is the smallest target that supports it.
[env:ble]
build_flags =
    ${env.build_flags}
    -DCC_ROAD_BLE
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    -DCONFIG_BT_NIMBLE_MAX_EXT_ADV_INSTANCES=1
    -DCONFIG_BT_NIMBLE_MAX_EXT_ADV_DATA_LEN=251
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^1.4.3

; Unauthenticated 802.11 management frames (vendor-specific action frames)
; injected and captured in promiscuous mode; needs no extra libraries.
[env:dot11]
build_flags =
    ${env.build_flags}
    -DCC_ROAD_80211
lib_deps =
    ${env.lib_deps}
