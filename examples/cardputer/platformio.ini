; cosechat demo for CardputerADV.
;
;   ./fetch-wolfssl.sh                                  # once: wolfSSL >= 5.8
;   pio run -e lora --target upload --target monitor    # M5 LoRa Cap 1262
;   pio run -e wifi --target upload --target monitor    # WiFi + UDP
;   pio run -e ble --target upload --target monitor     # anonymous BLE adverts
;   pio run -e dot11 --target upload --target monitor   # raw 802.11 mgmt frames
;
; The wifi env needs credentials: set WIFI_SSID/WIFI_PASS below.
;
; lib/wolfssl is a local PlatformIO library built from a wolfSSL >= 5.8 tree
; (the registry package stops at 5.7.2 and has no ML-KEM). See README.md.

[env]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
; wolfCOSE ships no PlatformIO manifest, so its include/ directory never reaches
; the cosechat library's own sources. PlatformIO expands ${PROJECT_LIBDEPS_DIR}
; and ${PIOENV} in this flag.
; Proof-of-work difficulty, in leading zero bytes: each step is 256x the work,
; linear in the packet size. These are RECEIVER policy - a stricter receiver
; drops what a laxer sender mined - and both ends of a mesh must agree or the
; stricter one silently ignores the other.
; Difficulty prices MINTING a fresh packet and nothing else. A replay of a
; captured packet needs no mining at all, so difficulty does nothing about
; replays (the per-peer replay windows do), and little about a flood from a
; real computer (the app rate limits do). What it does price is how cheap it is
; to mint a new packet, so the price sits on the small ones that make a
; receiver do expensive work - a 34-byte presence, a 27-byte key_req, or a
; link_req that costs the responder a KEM decapsulation plus a signature - and
; not on the bulk packets this node must mine for itself: an announce (6472 B,
; 27 fragments on LoRa) or an opportunistic chat (4515 B, 19 fragments) at
; difficulty 2 costs about a second of mining on a desktop host, which an
; ESP32-S3 cannot afford per message.
; Packet costs in this revision (host-measured, ./build/chat): link_req 1110 B
; = 5 fragments, link_proof 3331 B = 14, link_data 45 B = 1 (one AEAD record,
; no signature and no PoW), identify 3363 B = 14, opportunistic chat 4515 B =
; 19, presence 34 B = 1, key_req 27 B = 1. The exact byte counts move by a byte
; or two between runs (the mined nonce is CBOR-encoded, so its width varies);
; the fragment counts are stable.
; Host-measured (Apple M4, including the ML-DSA/ML-KEM work): announce
; d1 0.011 s / d2 0.98 s, chat d1 0.007 s / d2 0.09 s, presence
; d1 ~0 s / d2 0.05 s. The link packets are the same order as chat.
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DWOLFSSL_USER_SETTINGS
    -DCC_POW_DIFFICULTY=1
    -DCC_POW_DIFFICULTY_ANNOUNCE=1
    -DCC_POW_DIFFICULTY_CHAT=1
    -DCC_POW_DIFFICULTY_PRESENCE=2
    -DCC_POW_DIFFICULTY_KEY_REQ=2
    -DCC_POW_DIFFICULTY_LINK_REQ=2
    -DCC_POW_DIFFICULTY_LINK_PROOF=1
    -I${PROJECT_LIBDEPS_DIR}/${PIOENV}/wolfCOSE/include
lib_deps =
    m5stack/M5Cardputer
    symlink://lib/wolfssl
    https://github.com/konsumer/wolfCOSE.git#124ee3c
    symlink://../..

[env:lora]
lib_deps =
    ${env.lib_deps}
    jgromes/RadioLib

; Reuses the lora road but compiles the relay, so the opt-in path is built (and
; broken by CI) even though the default envs stay unchanged.
;
; Relay tuning, and why these values:
;   CC_RELAY_PATHS=16   768 B instead of 3072 B: a demo mesh has a handful of
;                       origins, and RAM is the scarce resource here.
;   CC_RELAY_DUP=16     320 B: on LoRa the packet rate inside the 300-tick
;                       duplicate window is a few packets, so 16 digests cover
;                       it; a busier road raises both.
;   CC_RELAY_BUDGETS=8  192 B: at this medium's pools (below) a 60 s window
;                       carries ~2.5 announces and a few chats, so eight
;                       distinct destinations in one window is ample.
; The rest stay at their defaults because the defaults ARE this medium: one
; SF7 / 125 kHz channel (~683 B/s of payload, so ~40960 B per 60-tick window),
; which the two airtime pools split -- CC_RELAY_AIRTIME_ANNOUNCE 16384 B
; (~2.5 announces at ~6.5 KB) and CC_RELAY_AIRTIME_DATA 24576 B (~5.4 chats)
; -- so one 6.5 KB announce cannot black out relayed data for the whole
; window. With CC_RELAY_FWD_BUDGET 3 per destination, CC_RELAY_DUP_TTL 300,
; CC_RELAY_PATH_TTL 600, CC_RELAY_WINDOW 60 and CC_RELAY_MAX_HOPS 8. The
; relay's `now` is seconds (see relayNow() in main.cpp) to match those tick
; units. A WiFi or Ethernet road raises both pools, FWD_BUDGET and BUDGETS
; together.
[env:lora-relay]
build_flags =
    ${env.build_flags}
    -DCC_RELAY
    -DCC_RELAY_PATHS=16
    -DCC_RELAY_DUP=16
    -DCC_RELAY_BUDGETS=8
lib_deps =
    ${env.lib_deps}
    jgromes/RadioLib

[env:wifi]
build_flags =
    ${env.build_flags}
    -DCC_ROAD_WIFI
    -DWIFI_SSID=\"your-ssid\"
    -DWIFI_PASS=\"your-pass\"

; Anonymous BLE extended advertising. Extended advertising must be enabled in
; NimBLE, and the ESP32-S3 is the smallest target that supports it.
[env:ble]
build_flags =
    ${env.build_flags}
    -DCC_ROAD_BLE
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    -DCONFIG_BT_NIMBLE_MAX_EXT_ADV_INSTANCES=1
    -DCONFIG_BT_NIMBLE_MAX_EXT_ADV_DATA_LEN=251
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^1.4.3

; Unauthenticated 802.11 management frames (vendor-specific action frames)
; injected and captured in promiscuous mode; needs no extra libraries.
[env:dot11]
build_flags =
    ${env.build_flags}
    -DCC_ROAD_80211
lib_deps =
    ${env.lib_deps}
